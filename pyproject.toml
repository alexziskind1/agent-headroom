[project]
name = "agent-headroom"
version = "0.1.0"
description = "Agent Headroom: memory-aware benchmarks for agent fleets (probe, plan, run, report)"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
bench = "bench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bench*"]

[tool.setuptools.package-data]
bench = ["catalog.json"]
